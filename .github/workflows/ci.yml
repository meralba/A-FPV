name: ROS 2 CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop-full

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize and update rosdep
        run: |
          . /opt/ros/jazzy/setup.sh
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update

      - name: Install dependencies and build workspace
        run: |
          . /opt/ros/jazzy/setup.sh
          apt-get update
          rosdep install --from-paths ws/src --ignore-src -y
          cd ws
          colcon build --symlink-install

      - name: Run unit tests (TDD verification)
        run: |
          . /opt/ros/jazzy/setup.sh
          cd ws
          colcon test
          colcon test-result --verbose
